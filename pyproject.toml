[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quadrotor-nmpc"
version = "1.0.0"
description = "Real-time nonlinear MPC for a Crazyflie nano-quadrotor with acados, simulated in PyBullet"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Anirudha Karande" }]
requires-python = ">=3.10"
keywords = ["model predictive control", "nmpc", "acados", "quadrotor", "crazyflie", "pybullet", "robotics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
# acados_template is installed from the acados source tree (see README).
dependencies = [
    "numpy>=1.24",
    "casadi>=3.6",
    "matplotlib>=3.8",
    "pybullet>=3.2.5",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/Anirudha-kw/acados-quadrotor-nmpc"

[tool.setuptools]
packages = ["quadrotor_nmpc"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: closed-loop runs that compile an acados solver"]
filterwarnings = ["ignore::DeprecationWarning"]
